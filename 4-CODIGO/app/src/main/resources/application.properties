spring.application.name=nom-colab
# Sin server.address: escucha en todas las interfaces, IPv4 e IPv6. Los demas equipos
# de la LAN entran por la IP del equipo; en el propio equipo, por localhost (que el
# navegador intenta primero por IPv6: fijar 0.0.0.0 lo hacia esperar ~5 s).
server.port=${NOM_PUERTO:8080}
server.compression.enabled=true
server.compression.mime-types=text/html,text/css,application/javascript,application/json,image/svg+xml
spring.mvc.async.request-timeout=-1
# Carpeta donde viven usuarios, espacios, documentos y versiones (JSON).
nom.datos=${NOM_DATOS:./datos-nom}
# Anuncio UDP de espacios visibles en la red local (CU-14 / CU-15).
nom.descubrimiento.activo=${NOM_DESCUBRIMIENTO:true}
nom.descubrimiento.puerto=47474
# Requerimiento no funcional: maximo 5 usuarios simultaneos por espacio.
nom.espacio.max-usuarios=5
# Bloqueo tras mas de 5 intentos fallidos.
nom.cuentas.max-intentos=5
nom.cuentas.minutos-bloqueo=15
nom.cuentas.horas-sesion=72

# ---------------------------------------------------------------- base de datos
# Usuarios, roles, sesiones y preferencias. En la red local: H2 embebido dentro de
# nom.datos (no hay nada que instalar). En Azure se sobreescriben con variables de
# entorno de la Web App: SPRING_DATASOURCE_URL / _USERNAME / _PASSWORD y
# NOM_DB_PLATAFORMA=sqlserver (Azure SQL Database).
spring.datasource.url=jdbc:h2:file:${nom.datos}/nom-db;MODE=MSSQLServer;DATABASE_TO_LOWER=TRUE
spring.datasource.username=nom
spring.datasource.password=
spring.sql.init.mode=always
spring.sql.init.platform=${NOM_DB_PLATAFORMA:h2}
# Azure SQL gratuito se pausa solo si nadie lo usa: sin conexiones ociosas
# permanentes, y al despertar (~1 min) se espera en lugar de fallar.
spring.datasource.hikari.minimum-idle=0
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.connection-timeout=${NOM_DB_ESPERA_MS:30000}
spring.datasource.hikari.initialization-fail-timeout=-1

# ---------------------------------------------------------------- roles
# Cuenta ADMINISTRADOR inicial (solo por variables de entorno; nunca en el codigo).
nom.admin.usuario=${NOM_ADMIN_USUARIO:}
nom.admin.contrasena=${NOM_ADMIN_CONTRASENA:}
