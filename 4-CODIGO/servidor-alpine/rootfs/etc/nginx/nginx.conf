# nginx for a small multi-site server. TLS is done by Tailscale (Serve/Funnel)
# or later by a tunnel; nginx speaks plain HTTP. Sites: /etc/nginx/http.d/*.conf
user nginx;
worker_processes 2;
pcre_jit on;
error_log stderr warn;
pid /run/nginx/nginx.pid;

events {
  worker_connections 512;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  server_tokens off;
  charset utf-8;

  sendfile on;
  tcp_nopush on;
  keepalive_timeout 30s;
  client_max_body_size 64m;

  gzip on;
  gzip_vary on;
  gzip_min_length 1024;
  gzip_types text/plain text/css text/xml application/javascript application/json
             application/xml application/rss+xml image/svg+xml;

  access_log off;   # enable per site: access_log /var/log/nginx/<site>.log;

  include /etc/nginx/http.d/*.conf;
}
