# mdevd rules (same syntax as busybox mdev). devtmpfs already creates every
# node; these only set owner/group/mode, and load modules for the stock
# kernel (the custom kernel has none: modprobe just fails quietly).
# <regex> <user>:<group> <mode> [command]

$MODALIAS=.*        root:root 0660 @modprobe -q "$MODALIAS"

null                root:root 0666
zero                root:root 0666
full                root:root 0666
random              root:root 0666
urandom             root:root 0666
tty                 root:tty  0666
ptmx                root:tty  0666
console             root:tty  0600
tty[0-9]+           root:tty  0620
kmsg                root:root 0640
rtc[0-9]*           root:root 0600
watchdog[0-9]*      root:root 0600
net/tun             root:root 0600
sd[a-z].*           root:disk 0660
nvme[0-9]+n[0-9]+.* root:disk 0660
loop[0-9]+          root:disk 0660
dri/.*              root:video 0660
fb[0-9]+            root:video 0660
snd/.*              root:audio 0660
input/.*            root:input 0660
