# Ajustes de NOM-COLAB en la Pi. Los lee el servicio nomcolab-servidor al arrancar
# (después de cambiar algo: doas nomcolab-pi reiniciar).
NOM_PUERTO=8080
NOM_DATOS=/var/lib/nomcolab/datos
# El servidor está en internet: no se anuncia por la red de la casa.
NOM_DESCUBRIMIENTO=false
# Espacio por cuenta en MB (documentos y versiones de sus espacios). 0 = sin límite.
NOM_CUOTA_MB=200
# Memoria máxima de Java.
NOM_MEMORIA=512m
