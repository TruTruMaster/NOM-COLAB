# Compila el jar y lo sube a Azure App Service en cada push a main.
# Requiere el secreto AZURE_WEBAPP_PUBLISH_PROFILE (perfil de publicación de nomcolab-wack).
name: Desplegar en Azure

on:
  push:
    branches: [main]
    paths: ['4-CODIGO/app/**', '.github/workflows/azure.yml']
  workflow_dispatch:

jobs:
  desplegar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Compilar
        run: mvn -q -B package -DskipTests
        working-directory: 4-CODIGO/app
      - name: Subir a Azure
        uses: azure/webapps-deploy@v3
        with:
          app-name: nomcolab-wack
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: 4-CODIGO/app/target/nom-colab.jar
